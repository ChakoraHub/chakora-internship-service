name: Deploy Internship Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  enable-maintenance:
    name: Enable maintenance mode
    runs-on: ubuntu-latest
    steps:
      - name: Enable maintenance through Internship FastAPI
        env:
          INTERNSHIP_MAINTENANCE_ON_URL: ${{ secrets.INTERNSHIP_MAINTENANCE_ON_URL }}
          MAINTENANCE_ON_URL: ${{ secrets.MAINTENANCE_ON_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          TARGET_URL="${INTERNSHIP_MAINTENANCE_ON_URL:-$MAINTENANCE_ON_URL}"
          TARGET_URL=$(echo "$TARGET_URL" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          MAINTENANCE_TOKEN=$(echo "$MAINTENANCE_TOKEN" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "[maintenance:on] Starting maintenance enable request"
          test -n "$TARGET_URL" || { echo "Missing INTERNSHIP_MAINTENANCE_ON_URL or MAINTENANCE_ON_URL secret"; exit 1; }
          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:on] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:on] MAINTENANCE_TOKEN is empty"
            exit 1
          fi
          echo "[maintenance:on] Endpoint is configured: $TARGET_URL"
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-on-response.txt \
            --dump-header maintenance-on-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$TARGET_URL" || true)
          echo "[maintenance:on] HTTP status: $status"
          echo "[maintenance:on] Response headers:"
          sed 's/[Aa]uthorization:[^[:space:]]*/Authorization: [redacted]/g' maintenance-on-headers.txt || true
          echo "[maintenance:on] Response body:"
          cat maintenance-on-response.txt || true
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "[maintenance:on] Maintenance enabled successfully"
          else
            echo "[maintenance:on] Warning: Service endpoint returned $status prior to deployment. Proceeding with deployment to start/restart PM2..."
          fi

  deploy:
    name: Deploy Internship to EC2
    runs-on: ubuntu-latest
    needs: enable-maintenance
    steps:
      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            set -e
            cd "${{ secrets.APP_PATH }}"
            git stash --include-untracked || true
            git fetch origin main
            git checkout -f -B main origin/main
            git stash drop || true
            if [ -f "requirements.txt" ]; then
              if [ -x "./intern-venv/bin/pip" ]; then
                ./intern-venv/bin/pip install -r requirements.txt
              elif [ -x "./venv/bin/pip" ]; then
                ./venv/bin/pip install -r requirements.txt
              elif command -v pip3 >/dev/null 2>&1; then
                pip3 install -r requirements.txt
              else
                pip install -r requirements.txt
              fi
            fi
            pm2 restart internship-service || pm2 restart "${{ secrets.PM2_SERVICE_NAME }}" || true
            echo "Deployment commands completed successfully."

  selenium-smoke-tests:
    name: Selenium Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: "latest"
          install-chromedriver: true

      - name: Install Selenium test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install selenium pytest requests

      - name: Wait for deployed Internship page
        env:
          INTERNSHIP_BASE_URL: https://www.chakorahub.com
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 10 "$INTERNSHIP_BASE_URL/internships" > /dev/null; then
              echo "Deployed website is responding."
              exit 0
            fi
            echo "Website not ready (attempt $attempt/12)."
            sleep 10
          done
          echo "Deployed website did not become ready."
          exit 1

      - name: Run Selenium smoke tests
        env:
          INTERNSHIP_BASE_URL: https://www.chakorahub.com
          EXPECT_MAINTENANCE_NOTICE: "true"
          RUN_WRITE_TESTS: "false"
        run: |
          pytest -v internship_smoke.py --junitxml=selenium-results.xml

      - name: Upload Selenium results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-results
          path: selenium-results.xml
          if-no-files-found: warn

  disable-maintenance:
    name: Disable maintenance after passing tests
    runs-on: ubuntu-latest
    needs: selenium-smoke-tests
    if: ${{ needs.selenium-smoke-tests.result == 'success' }}
    steps:
      - name: Disable maintenance through Internship FastAPI
        env:
          INTERNSHIP_MAINTENANCE_OFF_URL: ${{ secrets.INTERNSHIP_MAINTENANCE_OFF_URL }}
          MAINTENANCE_OFF_URL: ${{ secrets.MAINTENANCE_OFF_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          set -e
          TARGET_URL="${INTERNSHIP_MAINTENANCE_OFF_URL:-$MAINTENANCE_OFF_URL}"
          TARGET_URL=$(echo "$TARGET_URL" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          MAINTENANCE_TOKEN=$(echo "$MAINTENANCE_TOKEN" | tr -d '\r\n"' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          echo "[maintenance:off] Starting maintenance disable request"
          test -n "$TARGET_URL" || { echo "Missing INTERNSHIP_MAINTENANCE_OFF_URL or MAINTENANCE_OFF_URL secret"; exit 1; }
          if [ -n "$MAINTENANCE_TOKEN" ]; then
            echo "[maintenance:off] MAINTENANCE_TOKEN is configured (length: ${#MAINTENANCE_TOKEN})"
          else
            echo "[maintenance:off] MAINTENANCE_TOKEN is empty"
            exit 1
          fi
          echo "[maintenance:off] Endpoint is configured: $TARGET_URL"
          status=$(curl --silent --show-error --location --max-time 20 \
            --output maintenance-off-response.txt \
            --dump-header maintenance-off-headers.txt \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $MAINTENANCE_TOKEN" \
            --request POST "$TARGET_URL" || true)
          echo "[maintenance:off] HTTP status: $status"
          echo "[maintenance:off] Response headers:"
          sed 's/[Aa]uthorization:[^[:space:]]*/Authorization: [redacted]/g' maintenance-off-headers.txt || true
          echo "[maintenance:off] Response body:"
          cat maintenance-off-response.txt || true
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "[maintenance:off] Request failed"
            exit 1
          fi
          echo "[maintenance:off] Maintenance disabled successfully"
